name: Windows package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build:windows
      - uses: actions/upload-artifact@v7
        with:
          name: StringChat-Windows
          path: |
            dist/StringChat-Setup-*.exe
            dist/StringChat-Desktop.zip
            dist/StringChat-SHA256.txt
          if-no-files-found: error
          retention-days: 14
